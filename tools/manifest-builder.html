<!doctype html><html lang="ru"><meta charset="utf-8"><title>Manifest Builder — Corporate Takeover</title>
<style>body{font:14px ui-monospace,monospace;background:#050505;color:#b9ffb0;padding:20px;max-width:900px;margin:auto}button,input{font:inherit;color:inherit;background:#0e140d;border:1px solid #39ff14;padding:8px}pre{background:#0a0d0a;padding:12px;white-space:pre-wrap;max-height:50vh;overflow:auto}</style>
<h1>Manifest Builder</h1><p>Выбери папку <code>assets/audio</code> (внутри <code>industrial/calm</code>, <code>neon/action</code>, <code>hq</code>, <code>overdrive</code>, <code>stingers</code> …). Страница посчитает длительность и громкость (RMS) каждого файла и выдаст <code>manifest.json</code>. Целевая громкость −18 dBFS.</p>
<input type="file" id="f" webkitdirectory multiple> <button id="cp">Копировать manifest</button> <span id="st"></span><pre id="out"></pre>
<script>
const TARGET=-18,ctx=new (window.AudioContext||window.webkitAudioContext)();let tracks=[];
f.onchange=async()=>{tracks=[];const files=[...f.files].filter(x=>/\.(mp3|ogg|wav|m4a|aac|flac)$/i.test(x.name));let i=0;
 for(const file of files){st.textContent=`анализ ${++i}/${files.length}: ${file.name}`;const rel=(file.webkitRelativePath||file.name).split('/').slice(1),path=rel.join('/'),pool=rel.length>2?rel[0]+'/'+rel[1]:rel.length===2?rel[0]:'industrial/calm';
  try{const buf=await ctx.decodeAudioData(await file.arrayBuffer()),ch=buf.getChannelData(0);let s=0,n=0;for(let k=0;k<ch.length;k+=8){s+=ch[k]*ch[k];n++}const rms=Math.sqrt(s/n),db=20*Math.log10(rms||1e-6);
   tracks.push({path,pool,duration:+buf.duration.toFixed(1),rmsDb:+db.toFixed(1),gainDb:+Math.max(-12,Math.min(12,TARGET-db)).toFixed(1)})}catch(e){tracks.push({path,pool,error:String(e)})}}
 st.textContent='готово: '+tracks.length;out.textContent=JSON.stringify({version:1,tracks},null,1)};
cp.onclick=()=>navigator.clipboard.writeText(out.textContent);
</script></html>
